services:
  inference-api:
    container_name: kii-significance-inference-api
    build:
      context: .
      dockerfile: inference-api/Dockerfile
    environment:
      DEFAULT_MODEL_CHOICE: keras
      ALLOW_MODEL_FALLBACK: "true"
    ports:
      - "8008:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\").status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  dashboard:
    container_name: kii-significance-dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_URL: http://inference-api:8000
      DATA_FILE: /app/data/objects.json
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard/data:/app/data
    depends_on:
      inference-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8501/_stcore/health\").status == 200 else 1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
